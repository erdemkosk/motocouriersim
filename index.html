<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moto Courier Simulator</title>
<meta name="description" content="">
<meta property="og:title" content="Moto Courier Simulator">
<meta property="og:description" content="Şehir senin. Motor senin. Vardiya senin.">
<meta property="og:image" content="img/art/capsule.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="img/logo.png">
<style>
:root{
  --bg:#07090b;
  --panel:#12181f;
  --line:#212c36;
  --ink:#eef3f6;
  --ink-dim:#8fa0ad;
  --teal:#1fd3ae;
  --amber:#ffb02e;
  --cream:#f6efe2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:var(--teal);text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* ---------------------------------------------------------------- nav --- */
.nav{
  position:fixed;inset-inline:0;top:0;z-index:60;
  display:flex;align-items:center;gap:14px;padding:14px 22px;
  background:linear-gradient(to bottom,rgba(7,9,11,.85),rgba(7,9,11,0));
  transition:background .3s ease;
}
.nav.solid{background:rgba(7,9,11,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav img{width:40px;height:40px}
.nav .sp{flex:1}
.nav .soc-mini{display:flex;gap:6px}
.nav .soc-mini a{
  display:flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:50%;color:var(--ink-dim);transition:color .15s,background .15s;
}
.nav .soc-mini a:hover{color:var(--teal);background:rgba(255,255,255,.06)}
.nav .soc-mini svg{width:19px;height:19px;fill:currentColor}
#lang-pick{
  background:rgba(18,24,31,.85);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:14px;font-family:inherit;cursor:pointer;
}
.nav .btn-wish{padding:9px 20px;font-size:14.5px}
/* Dar ekranda üst çubukta yalnız logo + dil kalsın. #demo-nav ile:
   düğme JS'te btn-wish <-> btn-soon arasında sınıf değiştiriyor,
   sınıfa göre gizlemek btn-soon halini açıkta bırakıyordu. */
@media(max-width:640px){.nav .soc-mini{display:none}.nav #demo-nav{display:none}}

/* ------------------------------------------------------------- düğme --- */
.btn{
  display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;
  font-weight:800;font-size:17px;border:1px solid transparent;cursor:pointer;
  white-space:nowrap;
  transition:transform .15s ease,background .15s ease,box-shadow .15s ease;
}
/* İkon boyutu SINIFTAN BAĞIMSIZ: btn-wish -> btn-soon geçişinde svg
   boyutsuz kalıp düğmeyi yutuyordu. */
.btn svg{width:20px;height:20px;fill:currentColor;flex:none}
.btn:hover{text-decoration:none;transform:translateY(-2px)}
.btn-wish{
  background:var(--amber);color:#231400;
  box-shadow:0 6px 30px -6px rgba(255,176,46,.55);
}
.btn-wish:hover{background:#ffc258;box-shadow:0 10px 36px -6px rgba(255,176,46,.7)}
.btn-ghost{border-color:rgba(255,255,255,.28);color:var(--ink);background:rgba(255,255,255,.05);backdrop-filter:blur(4px)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
/* Steam URL'i girilene kadar: tıklanmayan dürüst rozet. */
.btn-soon{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.25);color:#c9d4dc;cursor:default;box-shadow:none;font-weight:600}
.btn-soon:hover{transform:none;background:rgba(255,255,255,.06);box-shadow:none}
@media(max-width:560px){.btn{font-size:15px;padding:13px 22px}}

/* --------------------------------------------------------------- hero --- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;padding:110px 24px 90px}
.hero .bg{position:absolute;inset:0;z-index:-1}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:center 40%;transform:scale(1.06);animation:heroDrift 26s ease-in-out infinite alternate}
@keyframes heroDrift{from{transform:scale(1.06) translateY(0)}to{transform:scale(1.12) translateY(-16px)}}
.hero .bg::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse at center 42%,rgba(7,9,11,0) 0%,rgba(7,9,11,.5) 68%,rgba(7,9,11,.92) 100%),
    linear-gradient(to top,var(--bg) 4%,rgba(7,9,11,.2) 40%);
}
.hero-logo{width:min(340px,64vw);filter:drop-shadow(0 16px 44px rgba(0,0,0,.7))}
.hero h1{
  margin:26px 0 10px;font-size:clamp(30px,5.2vw,54px);line-height:1.1;font-weight:900;
  letter-spacing:-.02em;color:var(--cream);text-shadow:0 4px 26px rgba(0,0,0,.6);
}
.hero h1 em{font-style:normal;color:var(--teal)}
/* Demo rozeti: logonun altında, demo sayfasına gidiyor. */
.demo-pill{
  display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:8px 17px 8px 13px;
  border-radius:999px;background:rgba(7,9,11,.58);border:1px solid rgba(31,211,174,.42);
  color:var(--ink);font-size:14.5px;line-height:1.3;backdrop-filter:blur(6px);
  transition:border-color .15s,transform .15s;
}
.demo-pill:hover{border-color:var(--teal);transform:translateY(-2px)}
.demo-pill[hidden]{display:none}
.demo-pill i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--teal);animation:ping 2s ease-out infinite}
.demo-pill b{font-weight:800;color:var(--teal)}
.demo-pill span{color:#b9c7d1;padding-left:10px;border-left:1px solid rgba(255,255,255,.2)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(31,211,174,.6)}80%,100%{box-shadow:0 0 0 9px rgba(31,211,174,0)}}
@media(max-width:560px){
  .demo-pill{flex-wrap:wrap;justify-content:center;column-gap:8px;row-gap:2px;border-radius:18px;font-size:13.5px}
  .demo-pill span{border-left:0;padding-left:0;flex-basis:100%;text-align:center}
}
.hero .cta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:26px}
.hero .socrow{display:flex;gap:10px;margin-top:30px}
.hero .socrow a{
  display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.07);color:var(--ink);border:1px solid rgba(255,255,255,.14);
  transition:color .15s,border-color .15s,transform .15s;backdrop-filter:blur(4px);
}
.hero .socrow a:hover{color:var(--teal);border-color:var(--teal);transform:translateY(-2px)}
.hero .socrow svg{width:21px;height:21px;fill:currentColor}
.scrolldown{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.scrolldown::after{
  content:"";width:1px;height:34px;background:linear-gradient(to bottom,var(--ink-dim),transparent);
  animation:drop 1.8s ease-in-out infinite;
}
@keyframes drop{0%{transform:scaleY(.2);transform-origin:top}55%{transform:scaleY(1)}100%{opacity:0}}


/* ------------------------------------------------------------- fragman --- */
/* Fragmanlar tek şeritte: biri bitince şerit sağa kayıp sıradakini açıyor.
   Şu an tek fragman var; ikinci .tslide eklenince oklar/noktalar geri gelir. */
.trailer{padding:84px 24px;border-bottom:1px solid var(--line);text-align:center}
.trailer h2{margin:0 0 30px;font-size:clamp(28px,4vw,44px);font-weight:900;letter-spacing:-.02em;color:var(--cream)}
.tshow{
  position:relative;max-width:1040px;margin:0 auto;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 34px 90px -40px rgba(0,0,0,.95);
  background:#000;
}
.ttrack{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.tslide{flex:0 0 100%;min-width:0}
.tslide video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.tnav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:2;
  width:44px;height:44px;padding:0;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.22);background:rgba(7,9,11,.62);color:var(--ink);
  backdrop-filter:blur(6px);transition:background .15s,color .15s,border-color .15s;
}
.tnav svg{width:20px;height:20px;fill:currentColor}
.tnav:hover{background:var(--amber);color:#231400;border-color:transparent}
.tnav.prev{left:12px}
.tnav.next{right:12px}
.tdots{display:flex;gap:9px;justify-content:center;margin-top:22px}
.tdot{
  width:9px;height:9px;padding:0;border:0;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.24);transition:background .2s,width .2s;
}
.tdot[aria-current="true"]{background:var(--amber);width:26px}
/* Tek fragman varken oklar ve noktalar yok (JS hidden basıyor). */
.tnav[hidden],.tdots[hidden]{display:none}
@media(max-width:560px){.tnav{width:38px;height:38px}.tnav.prev{left:8px}.tnav.next{right:8px}}

/* ------------------------------------------------------------- afişler --- */
/* Tanıtım görselleri — oyun içi kare DEĞİL; galeriden ayrı dursun diye
   ayrı bölüm, ayrı başlık. Steam'deki tek ana görselin üç kesimi: üstte
   logosuz geniş kesim (library hero), altta logolu yatay kapak ile dikey
   kapak yan yana. Dikey kutunun yüksekliği satırdan geliyor (resim mutlak
   konumlu), yatay kapağın boyuna eşitleniyor. */
.art-sec{padding:90px 0;border-bottom:1px solid var(--line)}
.art-sec .art-kick{
  font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);
  font-weight:800;margin:0 0 10px;text-align:center;
}
.art-sec h2{
  margin:0 0 8px;text-align:center;font-size:clamp(28px,4vw,44px);font-weight:900;
  letter-spacing:-.02em;color:var(--cream);
}
.art-sec .sub{text-align:center;color:var(--ink-dim);margin:0 auto 40px;max-width:660px}
.art-wall{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.art-wall figure{
  margin:0;position:relative;border-radius:14px;overflow:hidden;
  cursor:zoom-in;border:1px solid var(--line);background:var(--panel);
}
.art-wall img{width:100%;object-fit:cover;transition:transform .5s ease}
.art-wall .kw{grid-column:1/-1}
.art-wall .kw img{aspect-ratio:2400/776}
.art-wall .kc{grid-column:span 8}
.art-wall .kc img{aspect-ratio:1232/706}
.art-wall .kt{grid-column:span 4}
.art-wall .kt img{position:absolute;inset:0;height:100%;object-position:center top}
.art-wall figure:hover img{transform:scale(1.04)}
.art-wall figure:hover{border-color:var(--amber)}
.art-wall figcaption{
  position:absolute;inset-inline:0;bottom:0;padding:30px 14px 12px;font-size:13.5px;
  color:#e5edf2;background:linear-gradient(to top,rgba(4,6,8,.9),rgba(4,6,8,0));
}
@media(max-width:700px){
  .art-wall .kc,.art-wall .kt{grid-column:1/-1}
  .art-wall .kt{aspect-ratio:4/5}
}

/* -------------------------------------------------------------- facts --- */
.facts{background:var(--bg);border-bottom:1px solid var(--line)}
.facts .grid{display:grid;grid-template-columns:repeat(6,1fr)}
.fact{padding:30px 16px;text-align:center}
.fact b{display:block;font-size:clamp(24px,3.4vw,38px);color:var(--amber);line-height:1.1;font-weight:900}
.fact span{display:block;margin-top:6px;font-size:13.5px;color:var(--ink-dim)}
@media(max-width:860px){.facts .grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.facts .grid{grid-template-columns:repeat(2,1fr)}}

/* ------------------------------------------------------------ panolar --- */
.panel{position:relative;min-height:92svh;display:flex;align-items:flex-end;overflow:hidden}
.panel .bg{position:absolute;inset:0;z-index:-1}
.panel .bg img{width:100%;height:112%;object-fit:cover;will-change:transform}
.panel .bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(7,9,11,.94) 6%,rgba(7,9,11,.35) 42%,rgba(7,9,11,.08) 70%);
}
.panel.right{justify-content:flex-end}
.panel .txt{position:relative;padding:0 max(5vw,26px) 9svh;max-width:760px}
.panel .kick{
  font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);
  font-weight:800;margin:0 0 10px;
}
.panel h2{
  margin:0 0 12px;font-size:clamp(34px,6vw,72px);line-height:1.02;font-weight:900;
  letter-spacing:-.025em;color:var(--cream);text-shadow:0 4px 30px rgba(0,0,0,.55);
}
.panel p{margin:0;font-size:clamp(17px,2.1vw,22px);color:#d3dee6;max-width:44ch;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.panel.right .txt{text-align:end}
.panel.right p{margin-inline-start:auto}

/* ------------------------------------------------------------ galeri --- */
.gallery-sec{padding:90px 0}
.gallery-sec h2{
  margin:0 0 8px;text-align:center;font-size:clamp(28px,4vw,44px);font-weight:900;
  letter-spacing:-.02em;color:var(--cream);
}
.gallery-sec .sub{text-align:center;color:var(--ink-dim);margin:0 auto 40px;max-width:680px}
/* Steam sayfasındaki 22 karenin hepsi. Kapalıyken ilk 9 (tablette 8 — iki
   sütunda tek kare artmasın); "hepsini göster" .all verir. İki kare
   (.wide) masaüstünde iki sütun kaplıyor ki 22 kare satırları tam doldursun:
   9 + (13 + 2) = 8 tam satır. dense: tablette boşluk kalmasın. */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;grid-auto-flow:dense}
.gallery figure{margin:0;border-radius:14px;overflow:hidden;cursor:zoom-in;position:relative;aspect-ratio:16/9}
.gallery figure.wide{grid-column:span 2;aspect-ratio:auto}
.gallery img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.gallery figure:hover img{transform:scale(1.06)}
.gallery figcaption{
  position:absolute;inset-inline:0;bottom:0;padding:26px 14px 11px;font-size:13.5px;
  color:#e5edf2;background:linear-gradient(to top,rgba(4,6,8,.88),rgba(4,6,8,0));
}
.gallery:not(.all) figure:nth-child(n+10){display:none}
.ga-more{
  display:flex;align-items:center;gap:10px;margin:30px auto 0;padding:12px 24px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);color:var(--ink);
  font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s;
}
.ga-more:hover{border-color:var(--teal);color:var(--teal)}
.ga-more svg{width:18px;height:18px;fill:currentColor;transition:transform .2s}
.gallery.all+.ga-more svg{transform:rotate(180deg)}
@media(max-width:860px){
  .gallery{grid-template-columns:1fr 1fr}
  .gallery figure.wide{aspect-ratio:2/1}
  .gallery:not(.all) figure:nth-child(n+9){display:none}
}
@media(max-width:520px){.gallery{grid-template-columns:1fr}.gallery figure.wide{grid-column:auto;aspect-ratio:16/9}}

/* ------------------------------------------------------------ özellikler --- */
/* Steam sayfasındaki özellik blokları. Mağazanın döngü klibi masaya
   bantlanmış bir kart gibi — hafif eğik, hover'da düzelir, tıklayınca
   büyüteçte oynar; yanında mağazanın kendi başlığı ve maddeleri
   (i18n T_STEAM st*). .flip kartı sağa alıyor, satırlar dönüşümlü. */
.feats{padding:100px 24px 90px;overflow:hidden}
.feat{
  display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);align-items:center;
  gap:clamp(30px,5vw,76px);max-width:1140px;margin:0 auto;
}
.feat+.feat{margin-top:clamp(72px,9vw,124px)}
.feat.flip .mo{order:2}
.mo{
  --r:0deg;
  margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.9);cursor:zoom-in;position:relative;
  opacity:0;transform:translateY(36px) rotate(var(--r));
  transition:opacity .7s ease,transform .7s cubic-bezier(.16,1,.3,1);
}
.mo.in{opacity:1;transform:rotate(var(--r))}
.mo.in:hover{transform:rotate(0deg) scale(1.03);z-index:6}
.mo video,.mo img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:#000}
/* Bant parçası: kartı "masaya yapıştıran" yarı saydam şerit. */
.mo::before{
  content:"";position:absolute;top:-13px;left:50%;width:92px;height:26px;z-index:2;
  transform:translateX(-50%) rotate(calc(var(--r)*-1.5));
  background:rgba(255,176,46,.42);border:1px solid rgba(255,176,46,.18);border-radius:2px;
}
.ft h3{
  margin:0 0 16px;font-size:clamp(26px,3.3vw,38px);line-height:1.08;font-weight:900;
  letter-spacing:-.02em;color:var(--cream);
}
.ft h3::after{content:"";display:block;width:52px;height:2px;margin-top:14px;background:var(--teal)}
.ft p{margin:0 0 12px;color:#c8d4dc}
.ft p:last-child{margin-bottom:0}
.ft strong{color:var(--cream)}
.ft ul{margin:0;padding:0;list-style:none;display:grid;gap:11px}
.ft li{position:relative;padding-inline-start:24px;color:#c8d4dc;font-size:16.5px;line-height:1.55}
.ft li::before{
  content:"";position:absolute;inset-inline-start:3px;top:.62em;width:8px;height:8px;border-radius:2px;
  background:var(--amber);transform:rotate(45deg);
}
@media(max-width:860px){
  .feats{padding:80px 20px 70px}
  .feat{grid-template-columns:1fr;gap:32px}
  .feat.flip .mo{order:0}
}
@media(prefers-reduced-motion:reduce){
  .mo{opacity:1;transform:rotate(var(--r));transition:none}
  .mo.in{transform:rotate(var(--r))}
}

/* --------------------------------------------------------------- final --- */
.final{position:relative;padding:120px 24px;text-align:center;overflow:hidden;border-top:1px solid var(--line)}
.final .bg{position:absolute;inset:0;z-index:-1}
.final .bg video{width:100%;height:100%;object-fit:cover;display:block}
.final .bg::after{content:"";position:absolute;inset:0;background:rgba(7,9,11,.8)}
.final .logo{width:130px;margin:0 auto 22px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.final h2{margin:0 0 10px;font-size:clamp(30px,5vw,56px);font-weight:900;letter-spacing:-.02em;color:var(--cream)}
.final p{margin:0 0 30px;color:#c8d4dc;font-size:clamp(16px,2vw,20px)}
.final .cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.follow{margin-top:56px}
.follow h3{
  margin:0 0 18px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-dim);font-weight:800;
}
.follow .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.follow a{
  display:inline-flex;align-items:center;gap:11px;padding:13px 22px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--ink);
  font-size:15px;font-weight:600;transition:border-color .15s,color .15s,transform .15s;
}
.follow a:hover{border-color:var(--teal);color:var(--teal);text-decoration:none;transform:translateY(-2px)}
.follow svg{width:20px;height:20px;fill:currentColor;flex:none}
.follow small{color:var(--ink-dim);font-weight:400}

/* -------------------------------------------------------------- diller -- */
.langs-sec{padding:64px 24px;border-top:1px solid var(--line);text-align:center;background:var(--panel)}
.langs-sec h2{margin:0 0 22px;font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--cream)}
.langs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.langchip{
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;
  padding:9px 18px;font-size:15px;color:#bccad4;cursor:pointer;font-family:inherit;
  transition:border-color .15s,color .15s;
}
.langchip:hover{border-color:var(--teal);color:var(--teal)}
.langchip[aria-current="true"]{background:var(--teal);border-color:var(--teal);color:#03231c;font-weight:700}

/* ------------------------------------------------------------- footer --- */
footer{padding:36px 24px 100px;color:var(--ink-dim);font-size:14px;text-align:center}
footer .fsoc{display:flex;gap:18px;justify-content:center;margin-bottom:16px}
footer .fsoc a{color:var(--ink-dim)}
footer .fsoc a:hover{color:var(--teal)}
footer .fsoc svg{width:21px;height:21px;fill:currentColor}

/* ----------------------------------------------------- yapışkan çubuk --- */
.stickbar{
  position:fixed;inset-inline:0;bottom:0;z-index:70;
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));

@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

/* Kahraman giriş sahnesi: logo düşer, satırlar sırayla yükselir. */

.demo-pill{animation:rise .9s cubic-bezier(.16,1,.3,1) .35s backwards}

.scrolldown{animation:rise 1s ease 1.3s backwards}

/* İstek listesi düğmesinde ara sıra geçen parıltı. */
.btn-wish{position:relative;overflow:hidden}
.btn-wish::after{
  content:"";position:absolute;top:0;bottom:0;width:38%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shine 3.6s ease-in-out infinite;animation-delay:1.6s;
}

/* Pano metinleri: şerit, başlık, cümle sırayla. */
.panel .txt .kick,.panel .txt h2,.panel .txt p{
  opacity:0;transform:translateY(24px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);
}
.panel .txt.in .kick{opacity:1;transform:none}
.panel .txt.in h2{opacity:1;transform:none;transition-delay:.12s}
.panel .txt.in p{opacity:1;transform:none;transition-delay:.24s}
/* Şeridin altında büyüyen çizgi. */
.panel .kick::after{
  content:"";display:block;width:0;height:2px;margin-top:8px;background:var(--teal);
  transition:width .8s cubic-bezier(.16,1,.3,1) .3s;
}
.panel.right .kick::after{margin-inline-start:auto}
.panel .txt.in .kick::after{width:56px}

/* Kademeli beliriş: JS elemanlara --d gecikmesi basıyor. */
.reveal{transition-delay:var(--d,0s)}

/* Galeri kareleri parça parça. */
.gallery figure{opacity:0;transform:translateY(22px) scale(.98);transition:opacity .6s ease,transform .6s cubic-bezier(.16,1,.3,1)}
.gallery.in figure{opacity:1;transform:none}
.gallery.in figure:nth-child(2){transition-delay:.08s}
.gallery.in figure:nth-child(3){transition-delay:.16s}
.gallery.in figure:nth-child(4){transition-delay:.24s}
.gallery.in figure:nth-child(5){transition-delay:.32s}
.gallery.in figure:nth-child(6){transition-delay:.4s}

/* Final logosu hafifçe süzülür. */
.final .logo{animation:floaty 5.5s ease-in-out infinite}

/* Büyüteç yumuşak açılır. */
.lightbox.on img{animation:lbIn .22s ease}

@media(prefers-reduced-motion:reduce){

/* Oyun ilk açılırken ortada bir telefon: ekranda dikey klip oynuyor,
   klip bitince aynı ekran oyunun yükleme ekranına dönüyor, çubuk dolunca
   sahne siliniyor ve site açılıyor. Telefonu tutan el vardı, kaldırıldı —
   telefon tek başına hafifçe süzülüyor. */
html.intro-on,html.intro-on body{overflow:hidden}
.intro{
  position:fixed;inset:0;z-index:200;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:26px 20px calc(20px + env(safe-area-inset-bottom));

}

.intro .glow{
  position:absolute;inset:0;background:url(img/steam/night_ride.jpg) center/cover no-repeat;
  opacity:.12;filter:blur(26px) saturate(.7);pointer-events:none;
}
.intro.out{animation:introOut .75s cubic-bezier(.5,0,.75,0) forwards}

/* --- telefon --- */
.ph-in{
  position:relative;flex:none;
  animation:phoneIn 1.1s cubic-bezier(.16,1,.3,1) backwards;
}
.ph{
  position:relative;aspect-ratio:9/18.5;
  height:min(66svh,600px);max-height:calc((100vw - 56px)*18.5/9);
  border-radius:38px;padding:8px;
  background:linear-gradient(150deg,#39454f 0%,#12181e 38%,#0b1014 62%,#2c3841 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.06),
    0 34px 70px rgba(0,0,0,.72),
    0 0 110px rgba(31,211,174,.12);
  transform:rotate(-2.2deg);
  animation:hold 7s ease-in-out infinite;
}
.ph-scr{
  position:relative;width:100%;height:100%;border-radius:31px;overflow:hidden;
  background:#04070a;
}
.ph-scr video{width:100%;height:100%;object-fit:cover;display:block}
/* Dinamik ada + yan düğme: telefon gerçek dursun. */
.ph .island{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  width:30%;height:20px;border-radius:999px;background:#04070a;z-index:3;
}
.ph .side{
  position:absolute;right:-3px;top:26%;width:3px;height:64px;border-radius:0 3px 3px 0;
  background:linear-gradient(#3b4954,#151d24);
}

/* --- yükleme ekranı (telefonun içinde) --- */
.ph-load{
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:34px 26px;text-align:center;
  background:radial-gradient(120% 80% at 50% 34%,#131d26 0%,#05080c 72%);
  opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;
}
.ph-load.on{opacity:1;visibility:visible}
.ph-load img{width:34%;max-width:110px;animation:floaty 5.5s ease-in-out infinite}
.ph-load .lt{
  margin:0;font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--cream);
}
.ph-bar{width:78%;height:5px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.ph-bar i{
  display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .2s linear;
}
.ph-pct{margin:0;font-size:12px;color:var(--teal);font-variant-numeric:tabular-nums}
.ph-tip{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-dim);max-width:22ch}

/* Otomatik oynatma engellenirse: ekrana dokun, klip başlasın. */
.ph-tap{

  background:rgba(4,7,10,.5);border:0;cursor:pointer;padding:0;
}
.ph-tap.on{display:flex}
.ph-tap svg{width:62px;height:62px;fill:#fff;opacity:.92}

/* --- alt düğmeler --- */
.intro-bar{
  position:absolute;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));
  display:flex;gap:10px;animation:rise .6s ease .9s backwards;
}
.intro-btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--ink);
  font:600 14px/1 inherit;font-family:inherit;cursor:pointer;
  transition:border-color .15s,color .15s,transform .15s;
}

.intro-btn .i-on{display:none}

.intro-btn.muted .i-off{display:none}

@keyframes phoneIn{from{opacity:0;transform:translateY(70px) scale(.9)}to{opacity:1;transform:none}}
@keyframes hold{0%,100%{transform:rotate(-2.2deg) translateY(0)}50%{transform:rotate(-1.2deg) translateY(-7px)}}

<script src="i18n.js"></script>
<script>
/* ------------------------------------------------------------------------ *
 * STEAM BAĞLANTILARI. İstek listesi düğmeleri tam oyunun sayfasına, demo
 * düğmeleri (ve kahramandaki rozet) demonun sayfasına gidiyor. Bir adres
 * boş bırakılırsa o düğmeler "Steam sayfası hazırlanıyor" rozetine
 * dönüşür — çalışmayan düğme gösterilmiyor.
 * ------------------------------------------------------------------------ */
const STEAM_URL = "https://store.steampowered.com/app/5015840/Moto_Courier_Simulator/";
const DEMO_URL  = "https://store.steampowered.com/app/5190130/Moto_Courier_Simulator_Demo/";

const WISH_IDS = ["wish-hero", "wish-final", "wish-stick"];
const DEMO_IDS = ["demo-nav", "demo-hero", "demo-final", "demo-stick"];

function pickInitialLang() {
  const saved = localStorage.getItem("mcs_lang");
  if (saved && T[saved]) return saved;
  for (const nav of navigator.languages || [navigator.language || ""]) {
    const low = nav.toLowerCase();
    // pt-BR ile pt-PT AYRI: metinleri gerçekten farklı, tek "pt"ye indirme.
    if (low.startsWith("pt")) return low.includes("pt-pt") ? "pt_PT" : "pt_BR";
    const two = low.slice(0, 2);
    if (T[two]) return two;
  }
  // Sistem dili desteklenenlerden biri değilse İngilizce'ye düş.
  return "en";
}

function applyLang(code) {
  const t = T[code] || T.tr;
  const meta = LANGS.find(l => l.code === code) || LANGS[0];

  document.documentElement.lang = meta.html;
  document.title = t.title;
  document.querySelector('meta[name="description"]').content = t.desc;
  document.querySelector('meta[property="og:title"]').content = t.title;
  document.querySelector('meta[property="og:description"]').content = t.desc;

  for (const el of document.querySelectorAll("[data-i18n]")) {
    const v = t[el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;
  }

  // İçi ikon olan düğmelerin metni aria-label'da duruyor.
  for (const el of document.querySelectorAll("[data-i18n-label]")) {
    const v = t[el.dataset.i18nLabel];
    if (v !== undefined) el.setAttribute("aria-label", v);
  }

  // Düğmenin kendi görünümü (btn-wish / btn-ghost) data-base'de saklanıyor:
  // rozet halinde o sınıf kalkıyor ki parıltı rozetin üstünde dönmesin.
  for (const id of [...WISH_IDS, ...DEMO_IDS]) {
    const btn = document.getElementById(id);
    if (!btn) continue;
    const url = DEMO_IDS.includes(id) ? DEMO_URL : STEAM_URL;
    const base = btn.dataset.base ||
      (btn.dataset.base = btn.classList.contains("btn-ghost") ? "btn-ghost" : "btn-wish");
    const label = btn.querySelector("[data-i18n]");
    if (url) {
      btn.href = url;
      btn.target = "_blank";
      btn.rel = "noopener";
      btn.classList.remove("btn-soon");
      btn.classList.add(base);
      label.textContent = t[label.dataset.i18n];
    } else {
      btn.removeAttribute("href");
      btn.classList.remove(base);
      btn.classList.add("btn-soon");
      label.textContent = t.steam_soon;
    }
  }
  const pill = document.getElementById("demo-pill");
  pill.hidden = !DEMO_URL;
  if (DEMO_URL) { pill.href = DEMO_URL; pill.target = "_blank"; pill.rel = "noopener"; }

  for (const chip of document.querySelectorAll(".langchip")) {
    chip.setAttribute("aria-current", String(chip.dataset.code === code));
  }
  document.getElementById("lang-pick").value = code;
  localStorage.setItem("mcs_lang", code);
}

const picker = document.getElementById("lang-pick");
const chips = document.getElementById("lang-chips");
for (const l of LANGS) {
  const opt = document.createElement("option");
  opt.value = l.code;
  opt.textContent = l.name;
  picker.append(opt);

  const chip = document.createElement("button");
  chip.className = "langchip";
  chip.type = "button";
  chip.dataset.code = l.code;
  chip.textContent = l.name;
  chip.addEventListener("click", () => applyLang(l.code));
  chips.append(chip);
}
picker.addEventListener("change", () => applyLang(picker.value));
applyLang(pickInitialLang());


/* Sayaçlar: istatistik sayıları görünürken 0'dan sayılır.
   Yalnız düz tamsayılar ("800", "260") — "2,25 km²" olduğu gibi kalır. */
const factObs = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    factObs.unobserve(e.target);
    const b = e.target;
    const n = parseInt(b.textContent, 10);
    if (!/^\d+$/.test(b.textContent.trim()) || !isFinite(n)) continue;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) continue;
    const t0 = performance.now(), dur = 1300;
    const tick = (now) => {
      const k = Math.min((now - t0) / dur, 1);
      b.textContent = String(Math.round(n * (1 - Math.pow(1 - k, 3))));
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}, {threshold: .6});
document.querySelectorAll(".fact b").forEach(el => factObs.observe(el));

/* Pano metin sahnelemesi: .txt görünürken .in alır (çocuklar kademeli). */
const panelObs = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.isIntersecting) { e.target.classList.add("in"); panelObs.unobserve(e.target); }
  }
}, {rootMargin: "0px 0px -18% 0px"});
document.querySelectorAll(".panel .txt").forEach(el => {
  el.classList.remove("reveal");   // eski tek parça beliriş yerine sahneleme
  panelObs.observe(el);
});

/* Galeri: kapsayıcı .in alınca kareler nth-child gecikmesiyle geliyor. */
const galObs = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.isIntersecting) { e.target.classList.add("in"); galObs.unobserve(e.target); }
  }
}, {rootMargin: "0px 0px -12% 0px"});
document.querySelectorAll(".gallery").forEach(el => galObs.observe(el));

/* Görünüre girenleri yumuşak açan gözlemci. */
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }
}, {rootMargin: "0px 0px -10% 0px"});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* Kaydırma: üst çubuğu doldur, kahraman geçilince alt çubuğu göster. */
const nav = document.getElementById("nav");
const stick = document.getElementById("stickbar");
let heroH = window.innerHeight;
addEventListener("resize", () => { heroH = window.innerHeight; });
addEventListener("scroll", () => {
  nav.classList.toggle("solid", scrollY > 40);
  // Finaldeyken alt çubuk gizli: aynı düğme zaten ekranda, ikisi üst üste
  // binince ekranın altı iki kat düğme oluyordu.
  const fin = document.getElementById("steam").getBoundingClientRect();
  stick.classList.toggle("on", scrollY > heroH * 0.9 && fin.top > innerHeight * 0.6);
}, {passive: true});

/* Panolarda hafif paralaks — küçük translate, sadece görünürken. */
const panels = [...document.querySelectorAll(".panel .bg img")];
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  addEventListener("scroll", () => {
    for (const img of panels) {
      const r = img.closest(".panel").getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) continue;
      const k = (r.top + r.height / 2 - innerHeight / 2) / innerHeight;
      img.style.transform = `translateY(${k * -34}px)`;
    }
  }, {passive: true});
}

/* Klipler: yalnız görünürken oynasın — ekran dışında pil ve CPU yemesin. */
const clipObs = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.isIntersecting) e.target.play().catch(() => {});
    else e.target.pause();
  }
}, {rootMargin: "140px 0px"});
document.querySelectorAll("video[data-clip]").forEach(v => clipObs.observe(v));

/* Özellik kartları da beliriş gözlemcisine girsin. */
document.querySelectorAll(".mo").forEach(el => io.observe(el));

/* Galeri: kapalıyken ilk satırlar, düğme hepsini açıp kapatıyor. Etiketin
   anahtarı data-i18n'de değişiyor ki dil değişince doğru metin gelsin. */
const gallery = document.getElementById("gallery");
const gaMore  = document.getElementById("ga-more");
gaMore.addEventListener("click", () => {
  const all = gallery.classList.toggle("all");
  gaMore.setAttribute("aria-expanded", String(all));
  const label = gaMore.querySelector("[data-i18n]");
  label.dataset.i18n = all ? "ga_less" : "ga_more";
  label.textContent = T[picker.value][label.dataset.i18n];
  if (!all) gallery.scrollIntoView({block: "start"});
});

/* Fragmanlar tek şeritte. Oynayan bitince şerit sağa kayıyor ve sıradaki
   kendiliğinden başlıyor; sonuncudan sonra başa dönüyor. Otomatik geçişteki
   play() ilk oynatma kullanıcı tıklamasıyla başladığı için tarayıcıda
   engellenmiyor. Tek fragman varken oklar/noktalar gizli ve bitince
   kendini baştan açmıyor. */
const tTrack  = document.getElementById("ttrack");
const tDots   = document.getElementById("tdots");
const tSlides = [...tTrack.children];
const tVids   = tSlides.map(s => s.querySelector("video"));
let tIndex = 0;

function goTrailer(to, play) {
  const next = (to + tVids.length) % tVids.length;
  if (next !== tIndex) {
    tVids[tIndex].pause();
    tVids[tIndex].currentTime = 0;
  }
  tIndex = next;
  tTrack.style.transform = `translateX(-${tIndex * 100}%)`;
  tSlides.forEach((sl, n) => sl.toggleAttribute("inert", n !== tIndex));
  for (const [n, dot] of [...tDots.children].entries()) {
    dot.setAttribute("aria-current", String(n === tIndex));
  }
  if (play) tVids[tIndex].play().catch(() => {});
}

tVids.forEach((v, n) => {
  const dot = document.createElement("button");
  dot.className = "tdot";
  dot.type = "button";
  dot.setAttribute("aria-label", String(n + 1));
  dot.addEventListener("click", () => goTrailer(n, true));
  tDots.append(dot);

  // Yalnız GÖRÜNEN fragman bitince ilerlesin: arkada duran bir video
  // (ör. kullanıcı elle geçtiyse) şeridi oynatmasın.
  v.addEventListener("ended", () => { if (n === tIndex && tVids.length > 1) goTrailer(n + 1, true); });
});

const tPrev = document.getElementById("tprev");
const tNext = document.getElementById("tnext");
tPrev.addEventListener("click", () => goTrailer(tIndex - 1, true));
tNext.addEventListener("click", () => goTrailer(tIndex + 1, true));
tPrev.hidden = tNext.hidden = tDots.hidden = tVids.length < 2;
goTrailer(0, false);

/* Büyüteç — resim ve klip. Galeri ve afiş duvarında oklarla (ve klavye
   oklarıyla) aynı duvarın kareleri arasında geziliyor; galeri kapalıyken
   gizli kareler de sıraya dahil. */
const lb = document.getElementById("lb");
const lbImg = document.getElementById("lb-img");
const lbVid = document.getElementById("lb-vid");
const lbCap = document.getElementById("lb-cap");
let lbSet = [], lbAt = 0;

function closeLb() {
  lb.classList.remove("on");
  lbVid.pause();
  lbVid.removeAttribute("src");
  lbVid.load();
}
function showLbImg(n) {
  lbAt = (n + lbSet.length) % lbSet.length;
  const fig = lbSet[lbAt];
  lbImg.src = fig.querySelector("img").src;
  const cap = fig.querySelector("figcaption");
  lbCap.textContent = cap ? cap.textContent : "";
}
function openLbImg(set, n) {
  lbSet = set;
  lbVid.style.display = "none";
  lbImg.style.display = "block";
  lb.classList.toggle("multi", set.length > 1);
  showLbImg(n);
  lb.classList.add("on");
}
for (const wall of document.querySelectorAll(".gallery, .art-wall")) {
  const figs = [...wall.querySelectorAll("figure")];
  figs.forEach((fig, n) => fig.addEventListener("click", () => openLbImg(figs, n)));
}
for (const fig of document.querySelectorAll(".mo")) {
  fig.addEventListener("click", () => {
    if (!fig.dataset.full) { openLbImg([fig], 0); return; }
    lbImg.style.display = "none";
    lbVid.style.display = "block";
    lbCap.textContent = "";
    lb.classList.remove("multi");
    lbVid.src = fig.dataset.full;
    lb.classList.add("on");
    lbVid.play().catch(() => {});
  });
}
document.getElementById("lb-prev").addEventListener("click", e => { e.stopPropagation(); showLbImg(lbAt - 1); });
document.getElementById("lb-next").addEventListener("click", e => { e.stopPropagation(); showLbImg(lbAt + 1); });
// Klibin denetimlerine tıklamak büyüteci kapatmasın; geri kalan her yer kapatır.
lb.addEventListener("click", e => { if (e.target !== lbVid) closeLb(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLb();
  if (!lb.classList.contains("on") || !lb.classList.contains("multi")) return;
  if (e.key === "ArrowLeft") showLbImg(lbAt - 1);
  if (e.key === "ArrowRight") showLbImg(lbAt + 1);
});

/* -------------------------------------------------------------- açılış -- */
/* Klip telefonun ekranında oynuyor; bittiğinde (ya da video takılırsa /
   hata verirse) aynı ekran yükleme ekranına dönüyor, çubuk dolunca sahne
   kapanıyor. "Geç" doğrudan siteye alıyor. */
if (document.documentElement.classList.contains("intro-on")) {
  const intro   = document.getElementById("intro");
  const iVid    = document.getElementById("intro-vid");
  const iLoad   = document.getElementById("intro-load");
  const iFill   = document.getElementById("intro-fill");
  const iPct    = document.getElementById("intro-pct");
  const iTap    = document.getElementById("intro-tap");
  const iSound  = document.getElementById("intro-sound");
  const iSkip   = document.getElementById("intro-skip");
  let loading = false, done = false, guard = 0;

  try { sessionStorage.setItem("mcs_intro", "1"); } catch (e) {}
  scrollTo(0, 0);

  function endIntro() {
    if (done) return;
    done = true;
    clearTimeout(guard);
    iVid.pause();
    intro.classList.add("out");
    setTimeout(() => {
      document.documentElement.classList.remove("intro-on");
      intro.remove();
    }, 750);
  }

  // Yükleme ekranı: çubuk düzensiz aralıklarla doluyor, gerçek yükleme gibi.
  function toLoading() {
    if (loading || done) return;
    loading = true;
    clearTimeout(guard);
    iVid.pause();
    iTap.classList.remove("on");
    iLoad.classList.add("on");
    let p = 0;
    const tick = setInterval(() => {
      p = Math.min(100, p + (p < 65 ? 6 : 3) + Math.random() * 6);
      iFill.style.width = p + "%";
      iPct.textContent = Math.round(p) + "%";
      if (p >= 100) { clearInterval(tick); setTimeout(endIntro, 620); }
    }, 95);
  }

  iVid.addEventListener("ended", toLoading);
  iVid.addEventListener("error", toLoading);
  iSkip.addEventListener("click", endIntro);
  addEventListener("keydown", e => { if (e.key === "Escape") endIntro(); });

  iSound.addEventListener("click", () => {
    iVid.muted = !iVid.muted;
    iSound.classList.toggle("muted", iVid.muted);
    if (!iVid.muted) iVid.play().catch(() => {});
  });

  iTap.addEventListener("click", () => {
    iTap.classList.remove("on");
    iVid.play().catch(toLoading);
  });

  // Sessiz otomatik oynatma bile engellenirse dokunma katmanı çıksın.
  iVid.play().catch(() => { iTap.classList.add("on"); });

  // Video takılırsa sahne asla kapanmasın diye bekçi: süre + 5 sn sonra
  // yükleme ekranına geç.
  iVid.addEventListener("loadedmetadata", () => {
    clearTimeout(guard);
    guard = setTimeout(toLoading, (iVid.duration || 16) * 1000 + 5000);
  });
  guard = setTimeout(toLoading, 22000);
}
</script>
</body>
</html>
